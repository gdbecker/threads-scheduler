name: Threads Scheduler

on:
  schedule:
    # Morning posting window: 9:17-9:42 AM Eastern
    - cron: "17-42/5 9 * * *"
      timezone: "America/New_York"

    # Afternoon posting window: 3:02-3:27 PM Eastern
    - cron: "2-27/5 15 * * *"
      timezone: "America/New_York"

    # Backup checks: 12:07 PM and 6:07 PM Eastern
    - cron: "7 12,18 * * *"
      timezone: "America/New_York"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-due-threads:
    runs-on: ubuntu-latest

    env:
      THREADS_GARRETTS_DEV_DESK_USER_ID: ${{ secrets.THREADS_GARRETTS_DEV_DESK_USER_ID }}
      THREADS_GARRETTS_DEV_DESK_ACCESS_TOKEN: ${{ secrets.THREADS_GARRETTS_DEV_DESK_ACCESS_TOKEN }}
      THREADS_EDGE_STUDIO_USER_ID: ${{ secrets.THREADS_EDGE_STUDIO_USER_ID }}
      THREADS_EDGE_STUDIO_ACCESS_TOKEN: ${{ secrets.THREADS_EDGE_STUDIO_ACCESS_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Post due Threads posts
        run: npm run post:due

      - name: Commit post status updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Threads post statuses"
          file_pattern: posts/**/*.json
